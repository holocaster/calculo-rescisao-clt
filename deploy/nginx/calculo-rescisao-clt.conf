server {
    listen 2060;
    server_name calculorescisaoclt.prsites.com.br;

    root /var/www/calculo-rescisao-clt/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}